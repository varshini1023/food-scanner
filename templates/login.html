<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Food Scanner</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f5f7f6;
            margin: 0;
        }

        .container {
            width: 90%;
            max-width: 400px;
            margin: 80px auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #1f7a4d;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background: #1f7a4d;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        .message {
            color: red;
            text-align: center;
            margin-top: 15px;
        }

        .links {
            text-align: center;
            margin-top: 20px;
        }

        .links a {
            color: #1f7a4d;
            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>🍽️ Food Scanner</h1>

    <h2>Login</h2>

    <form method="POST">

        <label>
            Username
        </label>

        <input
            type="text"
            name="username"
            required
        >

        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>


    {% with messages = get_flashed_messages() %}

        {% if messages %}

            {% for message in messages %}

                <div class="message">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}


    <div class="links">

        <p>
            Don't have an account?
            <a href="{{ url_for('register') }}">
                Register
            </a>
        </p>

        <p>
            <a href="{{ url_for('home') }}">
                ← Back to Dashboard
            </a>
        </p>

    </div>

</div>

</body>

</html>
